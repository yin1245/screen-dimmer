name: Build Windows app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build
        shell: pwsh
        run: ./build.ps1 -OutputDirectory ./dist

      - name: Package
        shell: pwsh
        run: Compress-Archive -LiteralPath ./dist/ScreenDimmer.exe, ./使用说明.md, ./LICENSE -DestinationPath ./dist/ScreenDimmer-windows.zip

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: ScreenDimmer-windows
          path: |
            dist/ScreenDimmer.exe
            dist/ScreenDimmer-windows.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$env:GITHUB_REF_NAME" ./dist/ScreenDimmer.exe ./dist/ScreenDimmer-windows.zip --title "分屏息屏 $env:GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md --verify-tag
